name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npm run compile

      - name: Run unit tests
        run: npm test

      - name: Build and zip Chrome extension
        run: npm run zip

      - name: Build and zip Firefox extension
        run: npm run zip:firefox

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
